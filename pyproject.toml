[project]
name = "raft-kv-store"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn>=0.52.4",
    "watchfiles>=1.0.4",
