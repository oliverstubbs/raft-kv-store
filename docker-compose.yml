services:
  node1:
    build: .
    container_name: node1
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - node1_data:/data
    environment:
      NODE_ID: 1
      PEERS: node2:8000,node3:8000
  node2:
    build: .
    container_name: node2
    ports:
      - "8002:8000"
    volumes:
      - .:/app
      - node2_data:/data
    environment:
      NODE_ID: 2
      PEERS: node1:8000,node3:8000
  node3:
    build: .
    container_name: node3
    ports:
      - "8003:8000"
    volumes:
      - .:/app
      - node3_data:/data
    environment:
      NODE_ID: 3
      PEERS: node1:8000,node2:8000

volumes:
  node1_data:
  node2_data:
  node3_data:
